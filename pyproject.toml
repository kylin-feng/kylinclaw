[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "kylinclaw"
version = "0.1.0"
description = "Lightweight Python LLM agent framework — single file, zero heavy deps"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Kylin Feng", email = "kylin@aigcbox.com.cn" }]
keywords = ["llm", "agent", "ai", "openai", "deepseek", "framework"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "black", "ruff"]

[project.urls]
Homepage = "https://github.com/kylin-feng/kylinclaw"
Repository = "https://github.com/kylin-feng/kylinclaw"
Issues = "https://github.com/kylin-feng/kylinclaw/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["kylinclaw*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.black]
line-length = 100
target-version = ["py39"]
